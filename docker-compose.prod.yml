version: '3.9'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hrpro_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./mediafiles:/app/mediafiles:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    restart: always
    networks:
      - hrpro_network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: hrpro_web
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./mediafiles:/app/mediafiles
      - app_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - hrpro_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hrpro_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/backups:/backups
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - hrpro_network

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: hrpro_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - hrpro_network

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: hrpro_celery
    command: celery -A config worker -l INFO --concurrency=2
    volumes:
      - app_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - hrpro_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: hrpro_celery_beat
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - app_logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - hrpro_network

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  app_logs:

networks:
  hrpro_network:
    driver: bridge
