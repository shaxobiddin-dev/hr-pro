{% extends 'base.html' %}

{% block title %}Kelish/Ketish - HR-Pro{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
        <a href="{% url 'attendance:dashboard' %}" class="inline-flex items-center text-gray-600 hover:text-indigo-600 mb-4">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Orqaga
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Tezkor kelish/ketish</h1>
        <p class="text-gray-600">Xodimning kelish yoki ketish vaqtini qayd qiling</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Xodim -->
            <div>
                <label for="employee" class="block text-sm font-medium text-gray-700 mb-1">
                    Xodim *
                </label>
                {{ form.employee }}
            </div>

            <!-- Vaqt -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-700 mb-1">
                    Vaqt
                </label>
                <input type="time" name="time" id="time"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                <p class="text-sm text-gray-500 mt-1">Bo'sh qoldirsa hozirgi vaqt olinadi</p>
            </div>

            <!-- Amal tugmalari -->
            <div class="grid grid-cols-2 gap-4">
                <button type="submit" name="action" value="check_in"
                        class="flex items-center justify-center px-6 py-4 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    <span class="text-lg font-medium">Keldi</span>
                </button>
                <button type="submit" name="action" value="check_out"
                        class="flex items-center justify-center px-6 py-4 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span class="text-lg font-medium">Ketdi</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
