{% extends "base.html" %}
{% load i18n %}

{% block title %}Chiqish - HR-Pro{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <div class="w-16 h-16 mx-auto bg-amber-100 rounded-full flex items-center justify-center mb-6">
            <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Tizimdan Chiqish</h1>
        <p class="text-gray-600 mb-8">Rostdan ham tizimdan chiqmoqchimisiz?</p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}

            <div class="flex space-x-4">
                <a href="{% url 'core:dashboard' %}"
                   class="flex-1 py-3 px-4 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition-colors">
                    Bekor qilish
                </a>
                <button type="submit"
                        class="flex-1 py-3 px-4 bg-red-600 text-white font-medium rounded-xl hover:bg-red-700 transition-colors">
                    Chiqish
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
