# HR-Pro CI/CD Pipeline
# develop branch -> Production server (auto)

name: Deploy HR-Pro

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============ TEST ============
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hrpro_test
          POSTGRES_PASSWORD: hrpro_test
          POSTGRES_DB: hrpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run migrations check
        env:
          DATABASE_URL: postgres://hrpro_test:hrpro_test@localhost:5432/hrpro_test
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python manage.py migrate --check

      - name: Run tests
        env:
          DATABASE_URL: postgres://hrpro_test:hrpro_test@localhost:5432/hrpro_test
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python manage.py test --verbosity=2

  # ============ LINT ============
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install flake8 black isort

      - name: Check formatting (Black)
        run: black --check --diff .
        continue-on-error: true

      - name: Check imports (isort)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

  # ============ DEPLOY TO PRODUCTION ============
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/hr-pro

            # Pull latest code
            git fetch origin develop
            git reset --hard origin/develop

            # Activate venv and install deps
            source venv/bin/activate
            pip install -r requirements/prod.txt --quiet

            # Django commands
            export DJANGO_SETTINGS_MODULE=config.settings.prod
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Restart app
            sudo supervisorctl restart hr-pro

            echo "Deployment completed at $(date)"

      - name: Notify success
        if: success()
        run: echo "✅ Deployed to production successfully!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed!"
